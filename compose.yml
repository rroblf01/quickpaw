services:
  quick-paw-app:
    build:
      context: .
      args:
        INSTALL_DEV_DEPENDENCIES: "--group dev --group lint"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - quick-paw-db

  quick-paw-db:
    image: postgres:18.0-alpine3.22
    env_file:
      - .env
    volumes:
      - quick_paw_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quick-paw"]
      interval: 5s
      timeout: 5s
      retries: 5



volumes:
  quick_paw_db_data: